# Decap CMS 配置（Hugo + PaperMod）

backend:
  name: github
  repo: YGJing7/shushanqing
  branch: main
  base_url: https://decap-proxy.ygjing7.workers.dev
  auth_endpoint: /auth

# 后台界面语言：中文
locale: "zh_Hans"

# 博客地址（用于预览链接）
site_url: https://blog.shushanqing.ccwu.cc

# 图片：存在 static/images，文章里引用 /images/xxx.jpg，和电脑上 Obsidian 的写法一致
media_folder: "static/images"
public_folder: "/images"

collections:
  - name: "posts"
    label: "文章"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "发布日期", name: "date", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ssZ", date_format: "YYYY-MM-DD", time_format: "HH:mm" }
      - { label: "草稿", name: "draft", widget: "boolean", default: false }
      - { label: "标签", name: "tags", widget: "list", required: false }
      - { label: "摘要", name: "description", widget: "text", required: false }
      - label: "封面图"
        name: "cover"
        widget: "object"
        required: false
        collapsed: true
        fields:
          - { label: "图片", name: "image", widget: "image" }
          - { label: "替代文字", name: "alt", widget: "string", required: false }
          - { label: "图注", name: "caption", widget: "string", required: false }
      - { label: "正文", name: "body", widget: "markdown" }
